    <script>
      // Suppress Vite HMR WebSocket connection errors as HMR is disabled in AI Studio environment
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport') || e.message.includes('@vite/client'))) {
          e.preventDefault();
          e.stopPropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
